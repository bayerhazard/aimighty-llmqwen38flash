apiVersion: v1
kind: ConfigMap
metadata:
  name: aimqwen38flash-env
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimqwen38flash
    app.kubernetes.io/managed-by: Helm
data:
  CTX_SIZE: "{{ .Values.env.CTX_SIZE }}"
  THREADS: "{{ .Values.env.THREADS }}"
  PARALLEL: "{{ .Values.env.PARALLEL }}"
  SPEC_TYPE: "{{ .Values.env.SPEC_TYPE }}"
  DRAFT_MAX: "{{ .Values.env.DRAFT_MAX }}"
  MODEL_ALIAS: "{{ .Values.env.MODEL_ALIAS }}"
  NGPU_LAYERS: "{{ .Values.env.NGPU_LAYERS }}"
  N_CPU_MOE: "{{ .Values.env.N_CPU_MOE }}"
  BATCH_SIZE: "{{ .Values.env.BATCH_SIZE }}"
  UBATCH_SIZE: "{{ .Values.env.UBATCH_SIZE }}"

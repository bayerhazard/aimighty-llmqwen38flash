spec:
  versionName: '26.9.1'
  fullDescription: |
    AImighty flagship MoE stack for Qwen3.8-Flash-Next, the 180B-parameter (6B active) ultra-sparse hybrid-attention VL model, optimized for long-horizon agentic workflows with 200K+ context on Olares One.

    Model:
    - unsloth/Qwen3.8-Flash-Next-GGUF (UD-Q4_K_XL, 111.3 GB, 4-part split)
    - 125B LM + 51B N-gram embedding table (SSD/RAM offload via mmap + async prefetch) + 4B MTP branch
    - Vision: mmproj-F16.gguf on GPU (gpu-swap)
    - 200K token context, hybrid attention (Gated DeltaNet + Qwen Sparse Attention)

    Inference Engine:
    - llama.cpp qwen4exp/mtp @ 2c967293 (CUDA 13.1, sm_120 Blackwell, AVX-512/AMX custom build)
    - MTP speculative decoding (draft-mtp, --spec-draft-n-max 3, shared-tensor MTP module Q8_0)
    - Parallel slots: 1, Batch: 2048/512, Reasoning: on (medium effort, 8192-token budget)

    Key Features:
    - 6B active parameters per token — RAM inference close to GPU speed
    - N-gram lookup table offloaded to SSD/RAM (mmap, async prefetch)
    - Preserve thinking across multi-turn conversations
    - Hard reasoning budget (8192 tokens) prevents empty outputs

    API:
    - OpenAI-compatible: /v1/chat/completions, /v1/models, /health

    Resource Usage:
    - 1 GPU (RTX 5090, 16 GiB slice) + 40 GiB RAM limit
    - 115 GB model files on worker-local NVMe (pre-staged or auto-downloaded)
  upgradeDescription: |
    26.9.1: Initial dev deploy — Qwen3.8-Flash-Next (180B total / 6B active) UD-Q4_K_XL + MTP (draft-mtp, n-max 3) + Vision (mmproj-F16, gpu-swap); engine llama.cpp qwen4exp/mtp @ 2c967293 (CUDA 13.1, sm_120); models on worker-local NVMe (JuiceFS bypass); Built for Olares 1.12.6.
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen38flash
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen38flash
  requiredCpu: "12"
  limitedCpu: "20"
  requiredMemory: 40Gi
  limitedMemory: 58Gi
  requiredDisk: 120Gi
  limitedDisk: 130Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system

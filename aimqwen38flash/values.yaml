workloads:
  aimqwen38flash:
    replicaCount: 1

image:
  repository: ghcr.io/bayerhazard/buun-llama-qwen4
  tag: 28027a3
  full: ghcr.io/bayerhazard/buun-llama-qwen4:28027a3
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: aimqwen38flash

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 20
    memory: 58Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 12
    memory: 40Gi
    nvidia.com/gpu: 1

env:
  CTX_SIZE: "200000"
  THREADS: "12"
  PARALLEL: "1"
  MODEL_ALIAS: "qwen3.8-flash"
  NGPU_LAYERS: ""
  N_CPU_MOE: ""
  SPEC_TYPE: "draft-mtp"
  DRAFT_MAX: "3"
  DRAFT_NGL: "0"
  DRAFT_THREADS: "6"
  DRAFT_FILE: "MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf"
  BATCH_SIZE: "2048"
  UBATCH_SIZE: "512"
  CACHE_TYPE_K: "vbr"
  CACHE_TYPE_V: "vbr"
  VBR_ENTRY: "t8"
  FIT: "on"
  MOE_CACHE: "auto"
  SPLIT_MODE: "layer"
  MODEL_SUBDIR: "UD-IQ4_XS"
  MODEL_FILE: "Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf"
  MODEL_PARTS: "3"
  MODELS_DIR: "/models"
  MODELS_HOST_PATH: "/var/lib/olares-local-models"

nodeSelector: {}
tolerations: []
affinity: {}

probes:
  startup:
    path: /health
    port: 8000
    failureThreshold: 120
    periodSeconds: 30
    initialDelaySeconds: 60
    timeoutSeconds: 10
  liveness:
    path: /health
    port: 8000
    failureThreshold: 5
    periodSeconds: 30
    initialDelaySeconds: 600
    timeoutSeconds: 10
